name: comwificrack
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.9+5

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  wifi_scan: ^0.4.1+2
  permission_handler: ^12.0.1
  wifi_iot: ^0.3.19+2
  shared_preferences: ^2.5.4
  device_info_plus: ^12.3.0
  geolocator: ^14.0.2
  flutter_contacts: ^2.0.0
  supabase_flutter: ^2.12.0
  google_mobile_ads: ^7.0.0
  firebase_core: ^4.5.0
  firebase_messaging: ^16.1.2
  cloud_firestore: ^6.1.3
  firebase_storage: ^13.1.0

  provider: ^6.1.5+1
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  intl: ^0.20.2
  animated_emoji: ^3.2.1
  material_color_utilities: any
  carousel_slider: ^5.1.2
  url_launcher: ^6.3.2
  
  # --- DEPENDANCES EXPERTES AUDIO & P2P ---
  record: ^6.2.0
  audioplayers: ^6.6.0
  flutter_webrtc: ^1.4.0
  path_provider: ^2.1.5
  sqflite: ^2.4.2
  flutter_local_notifications: ^21.0.0
  # ----------------------------------------


  # Base de données locale
  objectbox: ^5.2.0
  objectbox_flutter_libs: ^5.2.0





  # Cryptographie E2E
  cryptography: ^2.9.0
  pointycastle: ^4.0.0

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0



  # Utils
  uuid: ^4.5.3

  rxdart: ^0.28.0
  connectivity_plus: ^7.0.0


  # UI
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.2.4
#----------------------------------------
  http: ^1.6.0
  workmanager: ^0.9.0+3      # Tâches en arrière-plan (polling)
  share_plus: ^12.0.1
  file_picker: ^10.3.10
  flutter_localizations:
    sdk: flutter
#  flutter_localization: ^0.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.12.2
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  objectbox_generator: ^5.2.0


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/splash.png"
    icon_size: 256

flutter_native_splash:
  background_image: "assets/splash.png"
  android_12:
    image: "assets/icon.png"
    color: "#ffffff"
    fullscreen: true
  fullscreen: true
  ios_content_mode: scaleAspectFill
  android_gravity: fill
  web_image_mode: cover

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/splash.png
    - assets/sounds/




